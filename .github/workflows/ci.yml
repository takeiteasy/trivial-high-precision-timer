name: CI

on:
  push:
    branches: [trunk, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    env:
      LISP: ${{ matrix.lisp }}
      THPT_FORCE_FALLBACK: ${{ matrix.force-fallback }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: SBCL / Linux,     os: ubuntu-latest,   lisp: sbcl-bin }
          - { name: CCL / Linux,      os: ubuntu-latest,   lisp: ccl-bin }
          - { name: ECL / Linux,      os: ubuntu-latest,   lisp: ecl }
          - { name: ABCL / Linux,     os: ubuntu-latest,   lisp: abcl-bin }
          - { name: SBCL / macOS,     os: macos-latest,    lisp: sbcl-bin }
          - { name: CCL / macOS,      os: macos-latest,    lisp: ccl-bin }
          - { name: ECL / macOS,      os: macos-latest,    lisp: ecl }
          - { name: ABCL / macOS,     os: macos-latest,    lisp: abcl-bin }
          - { name: SBCL / Windows,   os: windows-latest,  lisp: sbcl-bin }
          # Roswell supports few implementations on Windows.
          - { name: ABCL / Windows,   os: windows-latest,  lisp: abcl-bin, experimental: true }
          # Pure-CL fallback: no CFFI, no platform API. The only coverage this
          # backend can get, since no runner lacks a native one.
          - { name: Fallback / Linux,   os: ubuntu-latest,  lisp: sbcl-bin,  force-fallback: '1' }
          - { name: Fallback / macOS,   os: macos-latest,   lisp: sbcl-bin,  force-fallback: '1' }
          - { name: Fallback / Windows, os: windows-latest, lisp: sbcl-bin,  force-fallback: '1' }
          # CLISP runs the fallback: it is the implementation most likely to
          # lack a working CFFI in the wild.
          - { name: CLISP / Linux,      os: ubuntu-latest,  lisp: clisp,     force-fallback: '1', experimental: true }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: startsWith(matrix.lisp, 'abcl')
        with:
          distribution: temurin
          java-version: '21'

      - uses: 40ants/setup-lisp@v4
        with:
          asdf-system: trivial-high-precision-timer

      # The setup step builds the system without :thpt-force-fallback, so the
      # fallback cells would otherwise load prebuilt native FASLs: ASDF does
      # not recompile on a feature change. tests/run.lisp fails the job if the
      # backend it loaded is not the one asked for.
      - name: Clear ASDF cache
        shell: lispsh -eo pipefail {0}
        run: rm -rf ~/.cache/common-lisp

      - name: Run test suite
        shell: lispsh -eo pipefail {0}
        run: ros -Q run --load tests/run.lisp

  jscl:
    name: JSCL / node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # JSCL's make.sh cross-compiles with a host SBCL it expects on PATH.
      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl

      - name: Build JSCL
        env:
          # Pinned: JSCL is a moving target and its codegen bugs are this
          # repo's problem only when we choose to take them. See ticket #4.
          JSCL_COMMIT: 7981e5a5ba5821d4c1f862eec1cbda9ec3c51e77
        run: |
          git clone https://github.com/jscl-project/jscl.git "$RUNNER_TEMP/jscl"
          cd "$RUNNER_TEMP/jscl"
          git checkout "$JSCL_COMMIT"
          npm install
          ./make.sh
          test -f dist/jscl-node.js

      - name: Run test suite
        run: node "$RUNNER_TEMP/jscl/dist/jscl-node.js" tests/run-jscl.lisp

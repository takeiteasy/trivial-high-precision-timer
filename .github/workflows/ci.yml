name: CI

on:
  push:
    branches: [trunk, master]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      os:
        description: Run only this OS family
        type: choice
        options: [all, linux, macos, windows]
        default: all
      lisp:
        description: Run only Lisps whose name contains this text (for example ccl); empty for all
        type: string
        default: ''

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      extras: ${{ steps.plan.outputs.extras }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          INPUT_OS: ${{ inputs.os }}
          INPUT_LISP: ${{ inputs.lisp }}
        run: .github/scripts/plan.sh

  # The job list is .github/ci-matrix.json. CCL on macOS runs on the Intel
  # runner: Roswell has no ccl-bin for arm64 darwin, CCL ships no arm64 macOS
  # release, and Homebrew's formula is deprecated. The Fallback cells are the
  # pure-CL backend (no CFFI, no platform API), whose only coverage this is.
  test:
    needs: plan
    if: needs.plan.outputs.count != '0'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      LISP: ${{ matrix.lisp }}
      THPT_FORCE_FALLBACK: ${{ matrix.force-fallback }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        if: startsWith(matrix.lisp, 'abcl')
        with:
          distribution: temurin
          java-version: '21'

      # cache: false -- a restored Roswell cache has skipped the install and
      # left the job running with no implementation at all, while the action
      # still reported success. Rebuilding every run is the cheaper bug.
      - uses: 40ants/setup-lisp@v4
        with:
          asdf-system: trivial-high-precision-timer
          cache: false

      # The setup step builds the system without :thpt-force-fallback, so the
      # fallback cells would otherwise load prebuilt native FASLs: ASDF does
      # not recompile on a feature change. tests/run.lisp fails the job if the
      # backend it loaded is not the one asked for.
      - name: Clear ASDF cache
        shell: lispsh -eo pipefail {0}
        run: rm -rf ~/.cache/common-lisp

      - name: Run test suite
        shell: lispsh -eo pipefail {0}
        run: ros -Q run --load tests/run.lisp

  # CLISP has its own job: Roswell builds it from source and that build fails
  # on current Ubuntu. It runs the fallback, being the implementation most
  # likely to lack a working CFFI in the wild.
  clisp:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.extras), 'clisp')
    name: CLISP / Linux
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      THPT_FORCE_FALLBACK: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install CLISP and Quicklisp
        run: |
          sudo apt-get update
          sudo apt-get install -y clisp
          curl -sSLo "$RUNNER_TEMP/quicklisp.lisp" https://beta.quicklisp.org/quicklisp.lisp
          clisp -q -norc -x "(progn (load \"$RUNNER_TEMP/quicklisp.lisp\") (funcall (read-from-string \"quicklisp-quickstart:install\")))"

      - name: Run test suite
        run: clisp -q -norc tests/run.lisp

  jscl:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.extras), 'jscl')
    name: JSCL / node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # JSCL's make.sh cross-compiles with a host SBCL it expects on PATH.
      - name: Install SBCL
        run: sudo apt-get update && sudo apt-get install -y sbcl

      - name: Build JSCL
        env:
          # Pinned: JSCL is a moving target and its codegen bugs are this
          # repo's problem only when we choose to take them. See ticket #4.
          JSCL_COMMIT: 7981e5a5ba5821d4c1f862eec1cbda9ec3c51e77
        run: |
          git clone https://github.com/jscl-project/jscl.git "$RUNNER_TEMP/jscl"
          cd "$RUNNER_TEMP/jscl"
          git checkout "$JSCL_COMMIT"
          npm install
          ./make.sh
          test -f dist/jscl-node.js

      - name: Run test suite
        run: node "$RUNNER_TEMP/jscl/dist/jscl-node.js" tests/run-jscl.lisp
